# FetchCord configuration.
#
# Copy this file to %APPDATA%\FetchCord\fetch_cord.conf (or run
# "fetchcord --gen-config" to have it written for you) and edit away.
# Anything invalid is reported on startup and falls back to the default,
# so a typo here will never stop FetchCord from running.

[general]

# How many cycles to show between refreshes of memory / disk / battery.
poll_rate = 3

# Default seconds to show each cycle. Minimum is 15 (Discord rate limits
# presence updates). Individual cycles can override this below.
time = 30


# Valid values for top_line and bottom_line in every cycle:
#
#   os          Windows 11 Pro 24H2 x86_64
#   kernel      10.0.26100.4652
#   uptime      3 hours, 12 mins
#   cpu         AMD Ryzen 7 5800X (16) @ 3.80GHz
#   gpu         NVIDIA GeForce RTX 4070
#   memory      12.40 GiB / 31.92 GiB
#   disk        410.22 GiB / 930.90 GiB (44%)
#   host        ASUSTeK COMPUTER INC. ROG STRIX
#   board       ASUSTeK COMPUTER INC. TUF GAMING X570-PLUS
#   resolution  2560x1440 @ 165Hz
#   battery     87% (charging)
#   terminal    Windows Terminal
#   shell       PowerShell 7


[os]

# Shown under your Windows version.
enabled = on
top_line = kernel
bottom_line = memory
# Show your motherboard vendor as the small icon.
small_icon = on
# Leave blank to use [general] time.
time =

[hardware]

# Shown under your CPU.
enabled = on
top_line = cpu
bottom_line = gpu
# Show your GPU vendor as the small icon.
small_icon = on
time =

[host]

# Shown under your PC / motherboard vendor.
enabled = on
top_line = host
bottom_line = resolution
# Show a laptop or desktop small icon.
small_icon = on
time =

[terminal]

# Shown under your terminal. Off by default because it only makes sense when
# FetchCord is started from a terminal that stays open.
enabled = off
top_line = terminal
bottom_line = shell
small_icon = on
time =
