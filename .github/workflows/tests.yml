name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      # Exercises the real collectors - registry and Win32 on Windows,
      # /proc, /sys and /etc on Linux - against an actual host.
      - name: Detect this machine
        if: runner.os != 'macOS'
        run: fetchcord --dry-run

      - name: Refuses to run where there is no collector
        if: runner.os == 'macOS'
        run: |
          if fetchcord --dry-run; then
            echo "expected a non-zero exit with no collector for this platform" >&2
            exit 1
          fi
