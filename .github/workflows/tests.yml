name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      # Exercises the real collectors against an actual host of each kind:
      # registry and Win32 on Windows, /proc and /sys on Linux, sysctl and
      # CoreGraphics on macOS.
      - name: Detect this machine
        run: fetchcord --dry-run
